name: Python tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements-lock.txt
            requirements-r3-lock.txt
      - run: python -m pip install -r requirements-r3-lock.txt
      - run: python -c "import shap; print('SHAP', shap.__version__)"
      - run: python -m pip check
      - run: python -m unittest discover -s tests -v
      - run: python scripts/current.py verify --output outputs/ci_current_check
